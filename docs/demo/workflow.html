<style>
:root {
  --bg: #ffffff; --ink: #1a1a1a; --muted: #666666; --faint: #999999; --line: #dddddd;

  --script: #ffffff; --jira: #eaf2fb; --jira-line: #8fb3dd; --jira-ink: #1d4f8a;
  --cmd: #1a1a1a; --cmd-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141c; --ink: #eceef5; --muted: #a8adbd; --faint: #7d8296; --line: #343849;
    --lane-a: #191c27; --lane-b: #161924; --row: #1d2130;

    --purple: #b79be0; --purple-tint: #2a2338; --purple-line: #4b3d66;
    --green: #3fae70; --green-ink: #0b1a12; --green-tint: #17301f;
    --amber: #e4c45a; --amber-tint: #2e2812; --amber-line: #6b5a1c;
    --script: #1d2130; --jira: #172638; --jira-line: #36577f; --jira-ink: #9cc3ef;
    --cmd: #eceef5; --cmd-ink: #12141c;
  }
}
:root[data-theme="dark"] {
  --bg: #12141c; --ink: #eceef5; --muted: #a8adbd; --faint: #7d8296; --line: #343849;
  --lane-a: #191c27; --lane-b: #161924; --row: #1d2130;

  --cmd: #eceef5; --cmd-ink: #12141c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Poppins, "Segoe UI", system-ui, sans-serif; }
.wrap { padding: 16px; }

.s-cmd { fill: var(--cmd-ink); opacity: .75; }

.s-note { font-size: 11px; fill: var(--faint); font-style: italic; }

.gid { fill: var(--green-ink); opacity: .92; } .gid-t { font-size: 11px; font-weight: 600; fill: var(--green); }
.badge-agent { fill: var(--bg); stroke: var(--ice); } .badge-opus { fill: var(--bg); stroke: var(--purple-line); }
.badge-t { font-size: 10px; font-weight: 600; } .bt-agent { fill: var(--blue); } .bt-opus { fill: var(--purple); }
.t-pill-breaker { font-size: 11px; font-weight: 600; fill: var(--amber); }
.t-pill-human { font-size: 11px; font-weight: 600; fill: var(--green-ink); }
.t-pill-loop { font-size: 11px; font-weight: 600; fill: var(--navy); }
.t-pill-defect { font-size: 11px; font-weight: 600; fill: var(--purple); }
.row { fill: var(--row); stroke: var(--line); }
.row-t { font-size: 12px; fill: var(--ink); } .row-gate { font-size: 12px; fill: var(--green); font-weight: 500; }
.row-n { font-size: 11px; fill: var(--faint); font-style: italic; }
path { fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.e-main { stroke: var(--faint); } .e-cond { stroke: var(--faint); stroke-dasharray: 5 4; }
.e-loop { stroke: var(--blue); stroke-dasharray: 6 3; } .e-gate { stroke: var(--green); stroke-dasharray: 4 3; }
.e-brk { stroke: var(--amber); stroke-dasharray: 4 3; } .e-opus { stroke: var(--purple); stroke-dasharray: 6 3; }
.m-main { fill: var(--faint); } .m-loop { fill: var(--blue); } .m-gate { fill: var(--green); } .m-brk { fill: var(--amber); } .m-opus { fill: var(--purple); }
.lbl-bg { fill: var(--bg); opacity: .94; }

.rail-guard { fill: var(--green-tint); stroke: var(--green); } .rail-rec { fill: var(--lane-a); stroke: var(--line); }
.rail-step { fill: var(--tint); stroke: var(--ice); } .rail-stop { fill: var(--amber-tint); stroke: var(--amber-line); }
.rail-bud { fill: var(--amber-tint); stroke: var(--amber-line); }
.rail-t { font-size: 11.5px; font-weight: 600; fill: var(--ink); letter-spacing: .03em; }
.rail-s { font-size: 11px; fill: var(--muted); }
@media print { .toolbar { display: none; } svg { min-width: 0; } }

<rect x="1508" y="176" width="212" height="286" rx="10" class="rail-guard"/>

<text x="1520" y="232" class="rail-s" text-anchor="start"><tspan x="1520" dy="0"></tspan></text>
<text x="1520" y="246" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H1 no merge / approve</tspan></text>
<text x="1520" y="260" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H2 no git push</tspan></text>
<text x="1520" y="274" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H3 Jira: reads, comment,</tspan></text>
<text x="1520" y="288" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">    2 transitions only</tspan></text>
<text x="1520" y="302" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H4 author writes the plan only</tspan></text>
<text x="1520" y="316" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H5 critic rounds · no SendMessage</tspan></text>
<text x="1520" y="330" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H6 shell allowlist per agent</tspan></text>
<text x="1520" y="344" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H7 7 test launches</tspan></text>
<text x="1520" y="358" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H8 no MCP for subagents</tspan></text>
<text x="1520" y="372" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H9 no commit / PR writes</tspan></text>
<text x="1520" y="386" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H10 run state via scripts</tspan></text>
<text x="1520" y="400" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">H11 reads: worktree, run, plugin</tspan></text>
<rect x="1508" y="476" width="212" height="116" rx="10" class="rail-rec"/>

<text x="1520" y="518" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">Each agent's time and tokens</tspan></text>
<text x="1520" y="532" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">→ events.jsonl</tspan></text>
<text x="1520" y="546" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">Its handback → outputs/&lt;step&gt;.md</tspan></text>
<text x="1520" y="560" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">Never blocks</tspan></text>
<rect x="1508" y="606" width="212" height="214" rx="10" class="rail-step"/>
<text x="1520" y="628" class="rail-t" text-anchor="start"><tspan x="1520" dy="0">EVERY AGENT STEP</tspan></text>
<text x="1520" y="648" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">brief.mjs writes the brief</tspan></text>
<text x="1520" y="662" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">dispatch (no model override)</tspan></text>
<text x="1520" y="676" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">validate.mjs: schema + facts</tspan></text>
<text x="1520" y="690" class="rail-s" text-anchor="start"><tspan x="1520" dy="0"></tspan></text>
<text x="1520" y="704" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">invalid → &lt;step&gt;-fix</tspan></text>
<text x="1520" y="718" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">invalid again → G3:</tspan></text>
<text x="1520" y="732" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">  One more fix · Stop</tspan></text>
<text x="1520" y="746" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">&lt;step&gt;-fix-2 invalid → stop</tspan></text>
<text x="1520" y="760" class="rail-s" text-anchor="start"><tspan x="1520" dy="0"></tspan></text>
<text x="1520" y="774" class="rail-s" text-anchor="start"><tspan x="1520" dy="0">Agents: no Jira, no git writes</tspan></text>
